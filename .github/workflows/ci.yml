name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: job_intel
          POSTGRES_PASSWORD: job_intel
          POSTGRES_DB: job_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job_intel -d job_intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy app
      - name: Alembic upgrade
        env:
          DATABASE_URL: postgresql+psycopg://job_intel:job_intel@localhost:5432/job_intelligence
        run: alembic upgrade head
      - name: Pytest
        env:
          DATABASE_URL: postgresql+psycopg://job_intel:job_intel@localhost:5432/job_intelligence
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
