[project]
name = "job-intelligence-backend"
version = "0.1.0"
description = "AI-powered job search command centre - backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "anthropic>=0.39.0",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
    "pgvector>=0.3.5",
    "structlog>=24.4.0",
    "httpx>=0.27.2",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.11.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends(...) as a default arg is the framework's own idiom.
# UP042: keep `class X(str, Enum)` - broadest compatibility with
# pydantic/SQLAlchemy .value access patterns used throughout this codebase.
ignore = ["B008", "UP042"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
